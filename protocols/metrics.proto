syntax = "proto3";

package cluster.metrics;

// Metrics collection service
service MetricsCollector {
  rpc ReportMetrics(MetricsReport) returns (MetricsAck);
  rpc QueryMetrics(QueryRequest) returns (QueryResponse);
  rpc StreamMetrics(stream MetricsReport) returns (stream MetricsAck);
}

message MetricsReport {
  string node_id = 1;
  int64 timestamp = 2;
  NodeMetrics node_metrics = 3;
  repeated ModelMetrics model_metrics = 4;
  repeated SessionMetrics session_metrics = 5;
}

message MetricsAck {
  bool received = 1;
}

message QueryRequest {
  string node_id = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  repeated string metric_names = 4;
}

message QueryResponse {
  repeated MetricSeries series = 1;
}

message MetricSeries {
  string name = 1;
  repeated DataPoint points = 2;
}

message DataPoint {
  int64 timestamp = 1;
  double value = 2;
}

message NodeMetrics {
  CpuMetrics cpu = 1;
  MemoryMetrics memory = 2;
  repeated GpuMetrics gpus = 3;
  NetworkMetrics network = 4;
}

message CpuMetrics {
  double usage_percent = 1;
  double temperature_c = 2;
  uint32 active_threads = 3;
}

message MemoryMetrics {
  uint64 used_bytes = 1;
  uint64 committed_to_cluster_bytes = 2;
  uint64 available_bytes = 3;
  double pressure_percent = 4;
}

message GpuMetrics {
  string device_id = 1;
  double utilization_percent = 2;
  uint64 vram_used_bytes = 3;
  double temperature_c = 4;
  double power_draw_watts = 5;
  double clock_mhz = 6;
}

message NetworkMetrics {
  double tx_mbps = 1;
  double rx_mbps = 2;
  double rtt_ms = 3;
  uint32 connections = 4;
}

message ModelMetrics {
  string model_id = 1;
  string session_id = 2;
  double load_time_seconds = 3;
  double prompt_tokens_per_second = 4;
  double decode_tokens_per_second = 5;
  uint64 active_requests = 6;
}

message SessionMetrics {
  string session_id = 1;
  string model_id = 2;
  int64 start_time = 3;
  uint64 tokens_generated = 4;
  double avg_latency_ms = 5;
  double p50_latency_ms = 6;
  double p95_latency_ms = 7;
  double p99_latency_ms = 8;
}
