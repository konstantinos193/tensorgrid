[workspace]
members = [
    "crates/cluster-types",
    "crates/hardware-probe",
    "crates/secure-pairing",
    "crates/model-format",
    "crates/topology",
    "crates/observability",
    "services/coordinator",
    "services/node-agent",
    "services/scheduler",
    "services/planner",
    "services/tensor-directory",
    "services/model-registry",
    "services/pipeline-executor",
    "services/fine-tuning",
    "runtimes/ggml",
    "runtimes/cpu",
    "runtimes/cuda",
    "runtimes/rocm",
    "runtimes/mlx",
    "transports/tcp",
    "transports/quic",
    "transports/rdma",
    "tests/integration-test",
    "tests/end-to-end",
    "desktop-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensorgrid/tensorgrid"
authors = ["TensorGrid"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rustls = "0.23"
rustls-pemfile = "2.1"
