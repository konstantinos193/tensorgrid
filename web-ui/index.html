<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorGrid - Web UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 24px;
        }
        
        .url-input {
            display: flex;
            gap: 10px;
        }
        
        .url-input input {
            background: #252540;
            border: 1px solid #444;
            color: #eee;
            padding: 8px 12px;
            border-radius: 4px;
            width: 300px;
        }
        
        .url-input button {
            background: #88c0d0;
            color: #1a1a2e;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #88c0d0;
        }
        
        .card {
            background: #252540;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .metric {
            background: #1e1e38;
            padding: 15px;
            border-radius: 6px;
        }
        
        .metric-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .metric-value {
            font-size: 20px;
            font-weight: 600;
        }
        
        .node-list {
            display: grid;
            gap: 10px;
        }
        
        .node {
            background: #1e1e38;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .node-info h3 {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .node-info p {
            font-size: 12px;
            color: #888;
        }
        
        .node-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .node-status.healthy {
            background: #22c55e;
        }
        
        .node-status.suspect {
            background: #eab308;
        }
        
        .node-status.offline {
            background: #ef4444;
        }
        
        .chat-container {
            background: #1e1e38;
            border-radius: 8px;
            padding: 20px;
        }
        
        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        
        .message.user {
            background: #3b82f6;
            margin-left: 20%;
        }
        
        .message.assistant {
            background: #10b981;
            margin-right: 20%;
        }
        
        .chat-input {
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            background: #252540;
            border: 1px solid #444;
            color: #eee;
            padding: 10px;
            border-radius: 4px;
        }
        
        .chat-input button {
            background: #88c0d0;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .loading {
            color: #888;
        }
        
        .error {
            color: #ef4444;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-indicator.connected {
            background: #22c55e;
        }
        
        .status-indicator.disconnected {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>TensorGrid</h1>
                <span id="connection-status">
                    <span class="status-indicator disconnected"></span>
                    <span id="status-text">Disconnected</span>
                </span>
            </div>
            <div class="url-input">
                <input type="text" id="coordinator-url" value="http://[::1]:8080" placeholder="Coordinator URL">
                <button onclick="setCoordinatorUrl()">Connect</button>
            </div>
        </header>
        
        <div class="section">
            <h2>Cluster Overview</h2>
            <div class="card">
                <div class="metrics" id="cluster-metrics">
                    <div class="metric">
                        <div class="metric-label">CPU Units</div>
                        <div class="metric-value" id="cpu-units">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Host Memory</div>
                        <div class="metric-value" id="host-memory">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Device Memory</div>
                        <div class="metric-value" id="device-memory">-</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Nodes</div>
                        <div class="metric-value" id="node-count">-</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>Connected Nodes</h2>
            <div class="node-list" id="node-list">
                <div class="loading">Loading nodes...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>Chat</h2>
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message assistant">
                        <p>Hello! I'm ready to help. Send me a message to start chatting.</p>
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let coordinatorUrl = 'http://[::1]:8080';
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function setCoordinatorUrl() {
            coordinatorUrl = document.getElementById('coordinator-url').value;
            loadCluster();
            loadNodes();
        }
        
        async function loadCluster() {
            try {
                const response = await fetch(`${coordinatorUrl}/api/cluster`);
                const cluster = await response.json();
                
                document.getElementById('cpu-units').textContent = cluster.logical_resources.cpu_compute_units.toFixed(1);
                document.getElementById('host-memory').textContent = formatBytes(cluster.logical_resources.host_memory_bytes);
                document.getElementById('device-memory').textContent = formatBytes(cluster.logical_resources.device_memory_bytes);
                document.getElementById('node-count').textContent = cluster.node_count;
                
                document.querySelector('.status-indicator').className = 'status-indicator connected';
                document.getElementById('status-text').textContent = 'Connected';
            } catch (error) {
                console.error('Failed to load cluster:', error);
                document.querySelector('.status-indicator').className = 'status-indicator disconnected';
                document.getElementById('status-text').textContent = 'Disconnected';
            }
        }
        
        async function loadNodes() {
            try {
                const response = await fetch(`${coordinatorUrl}/api/cluster/nodes`);
                const data = await response.json();
                const nodes = data.nodes || [];
                const nodeList = document.getElementById('node-list');
                
                if (nodes.length === 0) {
                    nodeList.innerHTML = '<div class="loading">No nodes connected</div>';
                    return;
                }
                
                nodeList.innerHTML = nodes.map(node => `
                    <div class="node">
                        <div class="node-info">
                            <h3>${node.name}</h3>
                            <p>${node.hostname} • ${node.capabilities.cpu_cores} cores • ${formatBytes(node.capabilities.memory_bytes)}</p>
                        </div>
                        <div class="node-status ${node.status.toLowerCase()}">${node.status}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load nodes:', error);
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;
            
            const messagesDiv = document.getElementById('chat-messages');
            
            // Add user message
            messagesDiv.innerHTML += `
                <div class="message user">
                    <p>${message}</p>
                </div>
            `;
            
            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            try {
                const response = await fetch(`${coordinatorUrl}/api/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'llama-2-7b',
                        messages: [
                            { role: 'user', content: message }
                        ],
                        max_tokens: 100,
                        temperature: 0.7,
                    }),
                });
                
                const data = await response.json();
                
                if (data.error) {
                    messagesDiv.innerHTML += `
                        <div class="message assistant">
                            <p>Error: ${data.error.message}</p>
                        </div>
                    `;
                } else {
                    const assistantMessage = data.choices[0].message.content;
                    messagesDiv.innerHTML += `
                        <div class="message assistant">
                            <p>${assistantMessage}</p>
                        </div>
                    `;
                }
                
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (error) {
                console.error('Failed to send message:', error);
                messagesDiv.innerHTML += `
                    <div class="message assistant">
                        <p>Error: Failed to connect to coordinator</p>
                    </div>
                `;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }
        
        // Load data on startup
        loadCluster();
        loadNodes();
        
        // Refresh every 5 seconds
        setInterval(() => {
            loadCluster();
            loadNodes();
        }, 5000);
    </script>
</body>
</html>
